version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A workers.celery_app worker -Q pipeline -c 2 --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped
    # Docker socket mount so the worker can spawn sandbox containers
    # NOTE: this grants significant privilege — keep the worker image minimal
    # and use the allowlist in SandboxRunner to constrain what runs inside.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "docker"

  sandbox-builder:
    # One-shot service to build the sandbox images before workers start
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox/images:/images
    command: sh /images/build.sh
    profiles:
      - setup

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jira_pilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - WEBHOOK_URL=http://api:8000
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  n8n_data:
