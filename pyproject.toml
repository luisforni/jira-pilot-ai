[tool.poetry]
name = "jira-pilot-ai"
version = "0.1.0"
description = "Autonomous multi-agent platform that resolves Jira issues automatically"
authors = ["Luis Forni <forni.luis@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
celery = {extras = ["redis"], version = "^5.4.0"}
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.2.0"
anthropic = "^0.37.0"
openai = "^1.52.0"
gitpython = "^3.1.43"
jira = "^3.8.0"
httpx = "^0.27.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.13.0"
qdrant-client = {extras = ["fastembed"], version = "^1.12.0"}
redis = "^5.2.0"
python-dotenv = "^1.0.0"
structlog = "^24.4.0"
tiktoken = "^0.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
